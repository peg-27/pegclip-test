<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="app-version" content="11">
<meta name="theme-color" content="#1b1a18">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>PEGクリップ</title>

<!--
  ========================================
  PEGクリップ  セクション索引
  ========================================
  #SEC_CSS_BASE    色トークン・土台のスタイル
  #SEC_CSS_HEAD    ヘッダーとツールバー
  #SEC_CSS_PASTE   貼り付け枠の見た目
  #SEC_CSS_CARD    カード一覧の見た目
  #SEC_CSS_SHEET   下から出る入力シート／トースト
  #SEC_HTML        画面の構造
  #SEC_JS_DB       IndexedDB（開く・保存・読む・消す）
  #SEC_JS_STATE    メモリ上のカード配列と再描画
  #SEC_JS_ADD      カードを足す（テキスト／画像／メモ）
  #SEC_JS_CLIP     クリップボードの読み取り・書き込み
  #SEC_JS_PASTE    貼り付け枠（権限が要らない入り口）
  #SEC_JS_PICK     画像を選んで入れる（共有が使えないときの入り口）
  #SEC_JS_SHEET    入力シートの開閉と保存
  #SEC_JS_UTIL     URL判定・画像縮小・日付・トースト
  #SEC_JS_INBOX    共有メニューから届いたものを取り込む
  #SEC_JS_INIT     起動処理とイベント登録
  ========================================
-->

<style>
/* #SEC_CSS_BASE ------------------------------------ */
:root{
  --bg:#1b1a18;
  --panel:#252320;
  --line:#3a3733;
  --text:#ece7df;
  --dim:#9a938a;
  --tag:#e0a84e;
  --danger:#c96a5c;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
  padding-bottom:40px;
}
button{
  font-family:inherit;
  font-size:14px;
  color:var(--text);
  background:transparent;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 14px;
  cursor:pointer;
}
button:active{background:#333029;}
button:focus-visible{outline:2px solid var(--tag);outline-offset:2px;}
textarea,input[type="text"]{
  font-family:inherit;
  font-size:15px;
  color:var(--text);
  background:#1b1a18;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  width:100%;
}
textarea:focus,input:focus{outline:2px solid var(--tag);outline-offset:0;border-color:transparent;}

/* #SEC_CSS_HEAD ------------------------------------ */
header{
  padding:18px 16px 12px;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;
  background:var(--bg);
}
header h1{
  margin:0;
  font-size:19px;
  font-weight:600;
  letter-spacing:.04em;
}
header p{
  margin:2px 0 0;
  font-size:12px;
  color:var(--dim);
}
.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:12px 16px;
}
.toolbar button{flex:1;}
.toolbar .primary{flex-basis:100%;}
.toolbar .primary{
  background:var(--tag);
  border-color:var(--tag);
  color:#211d16;
  font-weight:600;
}

/* #SEC_CSS_PASTE ----------------------------------- */
.pastearea{padding:0 16px 14px;}
#pasteBox{
  min-height:76px;max-height:200px;overflow:auto;
  background:var(--panel);
  border:1px dashed var(--line);
  border-radius:var(--radius);
  padding:12px 14px;
  font-size:14px;
  word-break:break-word;
  -webkit-user-select:text;user-select:text;
}
#pasteBox:focus{outline:2px solid var(--tag);border-color:transparent;}
#pasteBox:empty::before{
  content:attr(data-ph);
  color:var(--dim);
  font-size:13px;
  line-height:1.6;
}
#pasteBox img{max-width:100%;max-height:150px;border-radius:6px;}
.pastearea .row{display:flex;gap:8px;margin-top:8px;}
.pastearea .row button{flex:1;}
.pastearea .row .take{background:var(--tag);border-color:var(--tag);color:#211d16;font-weight:600;}

/* #SEC_CSS_CARD ------------------------------------ */
#list{padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
.purpose{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  border-radius:0;
  padding:10px 14px 9px;
  font-size:13px;
  color:var(--tag);
  border-left:3px solid var(--tag);
  background:#2b2823;
}
.purpose.empty{color:var(--dim);border-left-color:var(--line);}

/* カードの中での編集 */
.edit-area{padding:12px 14px 4px;}
.edit-area label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px;}
.edit-area label + textarea,
.edit-area label + input{margin-bottom:12px;}
.edit-area textarea{resize:vertical;font-size:14px;line-height:1.6;}
.edit-area img{display:block;max-width:100%;max-height:160px;border-radius:8px;margin-bottom:12px;}
.actions .ok{background:var(--tag);border-color:var(--tag);color:#211d16;font-weight:600;margin-left:auto;min-width:88px;}
.actions .cancel{min-width:88px;}
.body{padding:12px 14px;}
.body pre{
  margin:0;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  max-height:8.5em;
  overflow:hidden;
  color:var(--text);
}
.body pre.open{max-height:none;}
.body img{
  display:block;
  max-width:100%;
  max-height:220px;
  border-radius:8px;
  background:#000;
}
.meta{
  padding:0 14px 8px;
  font-size:11px;
  color:var(--dim);
}
.actions{
  display:flex;gap:8px;
  padding:0 14px 12px;
}
.actions button{padding:7px 12px;font-size:13px;}
.actions .del{color:var(--danger);border-color:#4a3430;margin-left:auto;}
.empty-state{
  padding:60px 24px;
  text-align:center;
  color:var(--dim);
  font-size:14px;
}

/* #SEC_CSS_SHEET ----------------------------------- */
.backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,.55);
  display:none;z-index:20;
}
.backdrop.on{display:block;}
.sheet{
  /* 画面の上端近くに出す（キーボードが出ても、中身が空ならボタンまで見えるように） */
  position:fixed;left:12px;right:12px;
  top:calc(16px + env(safe-area-inset-top));
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  z-index:21;
  display:none;
  /* 画面より長くなったときは、モーダル全体をスクロールしてボタンまで行ける */
  max-height:calc(100vh - 32px);
  max-height:calc(100dvh - 32px);
  overflow:auto;
}
.sheet.on{display:block;}
.sheet-body{
  padding:18px 16px 4px;
}
.sheet h2{margin:0 0 12px;font-size:15px;font-weight:600;}
.sheet label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px;}
.sheet .row{
  display:flex;justify-content:space-between;gap:8px;
  padding:12px 16px 14px;
  border-top:1px solid var(--line);
}
.sheet .row button{min-width:88px;}
.sheet .row .ok{background:var(--tag);border-color:var(--tag);color:#211d16;font-weight:600;}
#toast{
  position:fixed;left:50%;bottom:28px;
  transform:translateX(-50%) translateY(10px);
  background:#3c3831;border:1px solid var(--line);
  color:var(--text);
  padding:10px 18px;border-radius:999px;
  font-size:13px;
  opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;
  z-index:30;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
@media (prefers-reduced-motion:reduce){#toast{transition:none;}}
</style>
</head>
<body>

<!-- #SEC_HTML ---------------------------------------- -->
<header>
  <h1>PEGクリップ</h1>
  <p>あとで使うかもしれないものを、理由ごと置いておく箱</p>
</header>

<div class="toolbar">
  <button id="btnPaste" class="primary">クリップボードから入れる</button>
  <button id="btnPick">画像を選んで入れる</button>
  <button id="btnNote">書いて入れる</button>
  <input type="file" id="filePick" accept="image/*" multiple hidden>
</div>

<div class="pastearea">
  <div id="pasteBox" contenteditable="true" data-ph="ここを長押しして「貼り付け」を選んでください。テキストも画像も受け取ります。"></div>
  <div class="row">
    <button id="btnTake" class="take">枠の中身を入れる</button>
    <button id="btnClearBox">枠を空にする</button>
  </div>
</div>

<div id="list"></div>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="sheet">
  <div class="sheet-body">
    <h2 id="sheetTitle">書いて入れる</h2>
    <label for="sheetText">内容</label>
    <textarea id="sheetText" rows="5"></textarea>
    <label for="sheetPurpose">何のために（一行）</label>
    <input type="text" id="sheetPurpose" placeholder="例：PEGコスメのアイコン候補を探すため">
  </div>
  <div class="row">
    <button id="sheetCancel" class="cancel">キャンセル</button>
    <button id="sheetSave" class="ok">OK</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* #SEC_JS_DB --------------------------------------- */
const DB_NAME = 'pegclip';
const DB_VER  = 2;   // 2で inbox（共有の受け取り箱）を追加
const STORE   = 'cards';
const INBOX   = 'inbox';
let db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        const store = d.createObjectStore(STORE, { keyPath:'id' });
        store.createIndex('createdAt', 'createdAt');
      }
      if(!d.objectStoreNames.contains(INBOX)){
        d.createObjectStore(INBOX, { keyPath:'id' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

function dbPut(card){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(card);
    tx.oncomplete = () => resolve();
    tx.onerror    = e => reject(e.target.error);
  });
}

function dbGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror   = e => reject(e.target.error);
  });
}

function dbDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror    = e => reject(e.target.error);
  });
}

/* #SEC_JS_STATE ------------------------------------ */
let cards = [];                 // 画像Blobも含めてメモリに保持する（コピー時に待たせないため）
const listEl = document.getElementById('list');

async function reload(){
  cards = await dbGetAll();
  cards.sort((a,b) => b.createdAt - a.createdAt);
  render();
}

function render(){
  const keepY = window.scrollY;   // 描き直しで一瞬ページが短くなっても位置を戻せるように覚えておく
  listEl.innerHTML = '';
  if(cards.length === 0){
    const p = document.createElement('div');
    p.className = 'empty-state';
    p.textContent = 'まだ何も入っていません。上のボタンから入れてください。';
    listEl.appendChild(p);
    return;
  }
  cards.forEach(card => listEl.appendChild(buildCard(card)));
  window.scrollTo(0, keepY);
}

// カード1枚だけを作り直して差し替える（一覧全体を描き直さないので画面が動かない）
function replaceCardEl(id){
  const card = cards.find(c => c.id === id);
  const old  = listEl.querySelector('[data-id="' + CSS.escape(String(id)) + '"]');
  if(!card || !old) return null;
  const el = buildCard(card);
  old.replaceWith(el);
  return el;
}

let inlineEditId = null;   // カードの中で編集中のカードのid（同時に1枚だけ）
let inlineDraft  = null;   // 書きかけの内容 { text, purpose }。画面を描き直しても消えないようにここに持つ

function buildCard(card){
  if(card.id === inlineEditId) return buildEditCard(card);

  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = String(card.id);

  // 何のために
  const purpose = document.createElement('button');
  purpose.className = 'purpose' + (card.purpose ? '' : ' empty');
  purpose.textContent = card.purpose || '（理由が書かれていません。押すと書けます）';
  purpose.addEventListener('click', () => startInlineEdit(card.id, 'purpose'));
  el.appendChild(purpose);

  // 中身
  const body = document.createElement('div');
  body.className = 'body';
  if(card.type === 'image'){
    const img = document.createElement('img');
    img.alt = '保存した画像';
    img.src = URL.createObjectURL(card.blob);
    body.appendChild(img);
  } else {
    const pre = document.createElement('pre');
    pre.textContent = card.text;
    pre.addEventListener('click', () => pre.classList.toggle('open'));
    body.appendChild(pre);
  }
  el.appendChild(body);

  // 日付など
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = labelOf(card) + ' ・ ' + formatDate(card.createdAt)
                   + (card.title ? ' ・ ' + card.title : '');
  el.appendChild(meta);

  // ボタン
  const actions = document.createElement('div');
  actions.className = 'actions';

  const copy = document.createElement('button');
  copy.textContent = 'コピー';
  copy.addEventListener('click', () => copyCard(card));
  actions.appendChild(copy);

  if(card.type === 'url'){
    const open = document.createElement('button');
    open.textContent = '開く';
    open.addEventListener('click', () => window.open(card.text, '_blank', 'noopener'));
    actions.appendChild(open);
  }

  const edit = document.createElement('button');
  edit.textContent = '編集';
  edit.addEventListener('click', () => startInlineEdit(card.id, 'text'));
  actions.appendChild(edit);

  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '削除';
  del.addEventListener('click', async () => {
    if(!confirm('このカードを削除します。よろしいですか。')) return;
    await dbDelete(card.id);
    await reload();
    toast('削除しました');
  });
  actions.appendChild(del);

  el.appendChild(actions);
  return el;
}

// 編集中のカード。見た目はカードのまま、中身と理由が入力欄になる
function buildEditCard(card){
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = String(card.id);

  const area = document.createElement('div');
  area.className = 'edit-area';

  // 何のために（通常のカードと同じく上に置く）
  const lab2 = document.createElement('label');
  lab2.textContent = '何のために（一行）';
  const purposeEl = document.createElement('input');
  purposeEl.type = 'text';
  purposeEl.value = inlineDraft.purpose;
  purposeEl.placeholder = '例：PEGコスメのアイコン候補を探すため';
  purposeEl.addEventListener('input', () => { inlineDraft.purpose = purposeEl.value; });
  area.appendChild(lab2);
  area.appendChild(purposeEl);

  // 内容（下）
  let textEl = null;
  if(card.type === 'image'){
    // 画像そのものは編集できないので、見るだけ
    const img = document.createElement('img');
    img.alt = '保存した画像';
    img.src = URL.createObjectURL(card.blob);
    area.appendChild(img);
  } else {
    const lab = document.createElement('label');
    lab.textContent = '内容';
    textEl = document.createElement('textarea');
    textEl.value = inlineDraft.text;
    textEl.addEventListener('input', () => { inlineDraft.text = textEl.value; });
    const lines = inlineDraft.text.split('\n').length;
    textEl.rows = Math.min(12, Math.max(3, lines + 1));
    area.appendChild(lab);
    area.appendChild(textEl);
  }
  el.appendChild(area);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const cancel = document.createElement('button');
  cancel.className = 'cancel';
  cancel.textContent = 'キャンセル';
  cancel.addEventListener('click', () => {
    endInlineEdit();
    replaceCardEl(card.id);
  });
  actions.appendChild(cancel);

  const ok = document.createElement('button');
  ok.className = 'ok';
  ok.textContent = 'OK';
  ok.addEventListener('click', async () => {
    if(textEl){
      const t = textEl.value.trim();
      if(!t){ toast('内容が空です'); return; }
      card.text = t;
      card.type = isUrl(t) ? 'url' : 'text';   // 書き換えでURLになった／URLでなくなった場合に合わせる
    }
    card.purpose = purposeEl.value.trim();
    await dbPut(card);
    endInlineEdit();
    await reload();
    toast('保存しました');
  });
  actions.appendChild(ok);

  el.appendChild(actions);

  // startInlineEdit から入力欄へカーソルを移せるように覚えておく
  el._purposeEl = purposeEl;
  el._textEl    = textEl;
  return el;
}

// 編集を始める。focusTo は最初に移る欄（'text' か 'purpose'）
function startInlineEdit(id, focusTo){
  if(inlineEditId === id) return;   // すでに編集中のカードなら何もしない

  // 別のカードを編集中で、書きかけに変更があるときは確認する
  if(inlineEditId !== null && isDraftChanged()){
    if(!confirm('編集中の内容は保存されていません。破棄して切り替えますか。')) return;
  }

  const card = cards.find(c => c.id === id);
  if(!card) return;
  // 前に編集していたカードがあれば、通常の形に戻す
  const prevId = inlineEditId;
  inlineEditId = id;
  inlineDraft  = { text: card.text || '', purpose: card.purpose || '' };
  if(prevId !== null) replaceCardEl(prevId);

  // 押したカードだけを編集の形に差し替える
  const el = replaceCardEl(id);
  if(!el) { render(); return; }

  // カーソルを移す。preventScroll で、ブラウザによる余計なスクロールを止める
  const target = (focusTo === 'purpose' || !el._textEl) ? el._purposeEl : el._textEl;
  target.focus({ preventScroll: true });
}

function endInlineEdit(){
  inlineEditId = null;
  inlineDraft  = null;
}

// 書きかけが保存済みの内容と違うかどうか
function isDraftChanged(){
  const card = cards.find(c => c.id === inlineEditId);
  if(!card || !inlineDraft) return false;
  return inlineDraft.text !== (card.text || '') || inlineDraft.purpose !== (card.purpose || '');
}

function labelOf(card){
  if(card.type === 'image') return '画像';
  if(card.type === 'url')   return 'URL';
  return 'テキスト';
}

/* #SEC_JS_ADD -------------------------------------- */
function newId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 貼った瞬間に保存する。理由はあとからカードの帯をタップして書く
async function addText(text){
  const t = text.trim();
  if(!t){ toast('中身が空です'); return; }
  const card = { id:newId(), type: isUrl(t) ? 'url' : 'text', text:t, purpose:'', createdAt:Date.now() };
  await dbPut(card);
  await reload();
  toast('入れました');
}

async function addImage(blob){
  const card = { id:newId(), type:'image', blob:blob, text:'', purpose:'', createdAt:Date.now() };
  await dbPut(card);
  await reload();
  toast('入れました');
}

/* #SEC_JS_CLIP ------------------------------------- */
async function pasteFromClipboard(){
  if(!navigator.clipboard || !navigator.clipboard.read){
    toast('このブラウザはクリップボードの読み取りに対応していません');
    return;
  }
  try{
    const items = await navigator.clipboard.read();
    if(items.length === 0){ toast('クリップボードは空です'); return; }
    const item = items[0];
    const imageType = item.types.find(t => t.startsWith('image/'));
    if(imageType){
      const raw = await item.getType(imageType);
      const shrunk = await shrinkImage(raw);
      await addImage(shrunk);
      return;
    }
    if(item.types.includes('text/plain')){
      const blob = await item.getType('text/plain');
      await addText(await blob.text());
      return;
    }
    toast('対応していない形式でした');
  }catch(err){
    toast('読み取れませんでした（権限を確認してください）');
    console.error(err);
  }
}

async function copyCard(card){
  try{
    if(card.type === 'image'){
      if(!navigator.clipboard || !window.ClipboardItem){
        toast('このブラウザは画像のコピーに対応していません'); return;
      }
      await navigator.clipboard.write([ new ClipboardItem({ 'image/png': card.blob }) ]);
      toast('画像をコピーしました');
    } else {
      await navigator.clipboard.writeText(card.text);
      toast('コピーしました');
    }
  }catch(err){
    toast('コピーできませんでした');
    console.error(err);
  }
}

/* #SEC_JS_PASTE ------------------------------------ */
// こちらは clipboard-read の権限を使わないので file:// でも動く
const pasteBox = document.getElementById('pasteBox');

pasteBox.addEventListener('paste', async (e) => {
  const dt = e.clipboardData;
  if(!dt) return;   // 取れないときは枠にそのまま貼られるので「枠の中身を入れる」で拾う

  // 画像が来ているか先に見る
  let file = null;
  for(const item of dt.items){
    if(item.kind === 'file' && item.type.startsWith('image/')){
      file = item.getAsFile();
      if(file) break;
    }
  }
  if(file){
    e.preventDefault();
    const shrunk = await shrinkImage(file);
    clearBox();
    await addImage(shrunk);
    return;
  }

  const text = dt.getData('text/plain');
  if(text && text.trim()){
    e.preventDefault();
    clearBox();
    await addText(text);
  }
});

// 貼り付けイベントが取れなかった場合の受け皿
async function takeFromBox(){
  const img = pasteBox.querySelector('img');
  if(img){
    const blob = await imgToBlob(img);
    if(!blob){ toast('画像を取り込めませんでした'); return; }
    const shrunk = await shrinkImage(blob);
    clearBox();
    await addImage(shrunk);
    return;
  }
  const text = pasteBox.innerText;
  if(text && text.trim()){
    clearBox();
    await addText(text);
    return;
  }
  toast('枠が空です');
}

// 枠に貼られた img から実データを取り出す（fetchが通らない環境ではcanvasで写し取る）
async function imgToBlob(img){
  try{
    const res = await fetch(img.src);
    return await res.blob();
  }catch(err){
    try{
      const canvas = document.createElement('canvas');
      canvas.width  = img.naturalWidth  || img.width;
      canvas.height = img.naturalHeight || img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      return await new Promise(r => canvas.toBlob(r, 'image/png'));
    }catch(err2){
      console.error(err, err2);
      return null;
    }
  }
}

function clearBox(){
  pasteBox.innerHTML = '';
}

/* #SEC_JS_PICK ------------------------------------- */
// 端末の画像を選んで入れる。複数選択できる
const filePick = document.getElementById('filePick');

filePick.addEventListener('change', async () => {
  const files = Array.from(filePick.files || []);
  filePick.value = '';   // 同じ画像をもう一度選んでも反応するように空にしておく
  if(files.length === 0) return;

  let ok = 0, ng = 0;
  const base = Date.now();
  for(let i = 0; i < files.length; i++){
    try{
      // 開けない画像（ブラウザが対応していない形式など）は入れない
      const bitmap = await createImageBitmap(files[i]);
      bitmap.close();
      const shrunk = await shrinkImage(files[i]);
      await dbPut({ id:newId(), type:'image', blob:shrunk, text:'',
                    purpose:'', createdAt: base + i });
      ok++;
    }catch(err){
      console.error(err);
      ng++;
    }
  }
  await reload();
  if(ng === 0)      toast(ok === 1 ? '入れました' : `${ok}件入れました`);
  else if(ok === 0) toast('画像を開けませんでした');
  else              toast(`${ok}件入れました（${ng}件は開けませんでした）`);
});

/* #SEC_JS_SHEET ------------------------------------ */
const sheet        = document.getElementById('sheet');
const backdrop     = document.getElementById('backdrop');
const sheetTextEl  = document.getElementById('sheetText');
const sheetPurpose = document.getElementById('sheetPurpose');

// シートは「書いて入れる」専用（理由の書き直しはカードの中で行う）
function openSheet(){
  sheetPurpose.value = '';
  sheetTextEl.value  = '';

  backdrop.classList.add('on');
  sheet.classList.add('on');
  sheet.scrollTop = 0;
  sheetTextEl.focus({ preventScroll: true });
}

function closeSheet(){
  backdrop.classList.remove('on');
  sheet.classList.remove('on');
}

async function saveSheet(){
  const t = sheetTextEl.value.trim();
  if(!t){ toast('内容が空です'); return; }
  const card = { id:newId(), type: isUrl(t) ? 'url' : 'text', text:t,
                 purpose: sheetPurpose.value.trim(), createdAt:Date.now() };
  await dbPut(card);
  closeSheet();
  await reload();
  toast('入れました');
}

/* #SEC_JS_UTIL ------------------------------------- */
function isUrl(s){
  return /^https?:\/\/\S+$/i.test(s.trim());
}

// 大きい画像はそのまま入れると容量を食うので、長辺1600pxまで縮めてPNGに揃える
function shrinkImage(blob){
  return new Promise(async (resolve) => {
    try{
      const bitmap = await createImageBitmap(blob);
      const max = 1600;
      let { width:w, height:h } = bitmap;
      if(w <= max && h <= max && blob.type === 'image/png'){
        bitmap.close();
        resolve(blob);
        return;
      }
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * scale);
      h = Math.round(h * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      bitmap.close();
      canvas.toBlob(out => resolve(out || blob), 'image/png');
    }catch(err){
      console.error(err);
      resolve(blob);
    }
  });
}

function formatDate(ms){
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

/* #SEC_JS_INBOX ------------------------------------ */
// 共有メニューから送られたものは sw.js がいったん inbox に入れる。
// アプリが開いたときにここで拾って、通常のカードに移し替える。
function inboxGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(INBOX, 'readonly');
    const req = tx.objectStore(INBOX).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror   = e => reject(e.target.error);
  });
}

function inboxDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(INBOX, 'readwrite');
    tx.objectStore(INBOX).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror    = e => reject(e.target.error);
  });
}

async function drainInbox(){
  let items = [];
  try{ items = await inboxGetAll(); }catch(err){ console.error(err); return 0; }
  if(items.length === 0) return 0;
  items.sort((a,b) => a.createdAt - b.createdAt);

  for(const item of items){
    try{
      if(item.kind === 'image'){
        const blob = await shrinkImage(item.blob);
        await dbPut({ id:newId(), type:'image', blob:blob, text:'',
                      title:item.title || '', purpose:'', createdAt:item.createdAt });
      } else {
        const t = (item.text || '').trim();
        if(t){
          await dbPut({ id:newId(), type: isUrl(t) ? 'url' : 'text', text:t,
                        title:item.title || '', purpose:'', createdAt:item.createdAt });
        }
      }
    }catch(err){
      console.error(err);
      // 移し替えに失敗したら、理由を【診断】カードとして残す
      try{
        await dbPut({ id:newId(), type:'text', text:'【診断】取り込み失敗: ' + item.kind + ' / ' + (err && err.message || err),
                      title:'', purpose:'', createdAt:Date.now() });
      }catch(e){}
    }
    await inboxDelete(item.id);
  }
  return items.length;
}

document.getElementById('btnPaste').addEventListener('click', pasteFromClipboard);
document.getElementById('btnNote').addEventListener('click', () => openSheet('note'));
document.getElementById('btnPick').addEventListener('click', () => filePick.click());

document.getElementById('btnClearBox').addEventListener('click', () => { clearBox(); toast('枠を空にしました'); });
document.getElementById('sheetSave').addEventListener('click', saveSheet);
document.getElementById('sheetCancel').addEventListener('click', closeSheet);
backdrop.addEventListener('click', closeSheet);

(async function init(){
  try{
    db = await openDB();
    const got = await drainInbox();
    await reload();
    if(got > 0){
      toast(got === 1 ? '共有から入れました' : `共有から${got}件入れました`);
      // アドレスの ?shared=1 を消しておく（再読み込みで二重に反応しないように）
      if(location.search) history.replaceState(null, '', location.pathname);
    }
  }catch(err){
    console.error(err);
    listEl.innerHTML = '<div class="empty-state">保存領域を開けませんでした。Chromeで開き直すと動くことがあります。</div>';
  }
})();

// Service Worker（共有メニューの受け取り役）。file:// では登録されないが、動作に支障はない
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
  });
}
